<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaestroIA - MVP</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        button { background: #6366f1; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #4f46e5; }
        select, input { padding: 10px; margin: 10px 0; width: 90%; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 MaestroIA</h1>
        <p>Sube una canción y genera tu clase temática</p>
        
        <input type="file" id="audio" accept="audio/*">
        
        <select id="instrumento">
            <option value="piano">Teclado / Piano</option>
            <option value="guitarra">Guitarra</option>
            <option value="bajo">Bajo</option>
            <option value="voz">Voz</option>
        </select>
        
        <input type="text" id="tematica" placeholder="Ej: Mario Bros, Dinosaurios, Star Wars">
        
        <button onclick="alert('¡Esta es tu web! Pronto conectaremos la IA.')">Generar Clase Automática</button>
    </div>
</body>
</html>
